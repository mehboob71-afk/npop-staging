<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>NPOP Enterprise Staging</title>
<style>
:root{--navy:#0b1f38;--navy2:#102b4c;--blue:#1473e6;--bg:#f4f7fb;--line:#dde5ee;--text:#18304f;--muted:#6b7d91;--green:#12945b;--orange:#d98916;--red:#c93b42}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:var(--text)}.app{min-height:100vh;display:grid;grid-template-columns:230px 1fr}.side{background:var(--navy);color:white;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-weight:900;font-size:18px;letter-spacing:.8px;margin:4px 8px 18px}.brand small{display:block;font-size:9px;color:#9fb4cc;margin-top:4px}.stage{font-size:9px;background:#17395e;border:1px solid #2c5278;padding:8px;border-radius:7px;margin:12px 6px;color:#d6e3f0}.nav button{width:100%;border:0;background:transparent;color:#c7d5e4;text-align:left;padding:10px 11px;border-radius:7px;margin:2px 0;font-size:12px;cursor:pointer}.nav button.active,.nav button:hover{background:var(--navy2);color:white}.main{min-width:0}.top{height:62px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0}.top h1{font-size:18px}.pill{padding:6px 9px;border:1px solid var(--line);background:white;border-radius:16px;font-size:10px;margin-left:6px}.content{padding:18px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:10px 0 14px}.card,.panel{background:white;border:1px solid var(--line);border-radius:9px;box-shadow:0 1px 2px rgba(15,38,65,.03)}.card{padding:13px}.card span{font-size:9px;color:var(--muted)}.card b{display:block;font-size:21px;margin-top:7px}.panel{overflow:hidden;margin-bottom:12px}.panel h3{margin:0;padding:12px 14px;border-bottom:1px solid var(--line);font-size:13px}.body{padding:12px 14px}.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.filters select,.filters input{padding:8px;border:1px solid var(--line);border-radius:6px;background:white;font-size:11px}table{width:100%;border-collapse:collapse;font-size:10px}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid #edf1f5}th{background:#f8fafc;color:#536880;font-size:9px}.tag{display:inline-block;padding:3px 6px;border-radius:10px;font-size:8px;font-weight:800}.green{background:#e8f7ef;color:#0a7d49}.orange{background:#fff1dd;color:#bd6b00}.red{background:#fde9ea;color:#b52d35}.blue{background:#eaf3ff;color:#1266c9}.btn{border:1px solid #cad8e7;background:white;color:#175db7;border-radius:6px;padding:8px 10px;font-weight:800;font-size:10px;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:white}.form{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.form label{font-size:9px;font-weight:800}.form input,.form select{width:100%;margin-top:4px;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:10px}.note{font-size:10px;color:var(--muted);line-height:1.5}.warn{background:#fff8e8;border:1px solid #f0d49b;padding:10px;border-radius:7px;color:#805500;font-size:10px}.ok{background:#effaf4;border:1px solid #c6ead6;padding:10px;border-radius:7px;color:#17663f;font-size:10px}@media(max-width:900px){.app{grid-template-columns:190px 1fr}.cards{grid-template-columns:repeat(2,1fr)}.form{grid-template-columns:1fr}}
</style></head><body><div class="app"><aside class="side"><div class="brand">NPOP ENTERPRISE<small>N&amp;Partners Restaurant Group</small></div><div class="stage">STAGING ENVIRONMENT<br>Test data only</div><div class="nav" id="nav"></div></aside><main class="main"><header class="top"><h1 id="title">Executive Command Centre</h1><div><span class="pill">STAGING</span><span class="pill">Director</span></div></header><div class="content" id="content"></div></main></div>
<script>
var restaurants=['Main Street','Meadowvale','Financial','400 Queen','1402 Queen','Royal West','Midland'];
var modules=[['dashboard','Executive Command Centre'],['restaurant','Restaurant Dashboard'],['sales','Sales Entry'],['employees','Employee Management'],['time','Time Entries'],['schedule','Weekly Schedule'],['payroll','Payroll'],['food','Food Cost'],['reports','Reports'],['evaluation','Evaluation & Compliance'],['tasks','Management Tasks'],['settings','Admin / Settings']];
var nav=document.getElementById('nav'),content=document.getElementById('content');
function money(n){return '$'+Number(n).toLocaleString()}
function cards(a){var h='<div class="cards">';for(var i=0;i<a.length;i++)h+='<div class="card"><span>'+a[i][0]+'</span><b>'+a[i][1]+'</b></div>';return h+'</div>'}
function filters(){var o='';for(var i=0;i<restaurants.length;i++)o+='<option>'+restaurants[i]+'</option>';return '<div class="filters"><select><option>All Brands</option><option>Popeyes Canada</option><option>Osmow\'s Canada</option><option>Osmow\'s US</option></select><select>'+o+'</select><select><option>This Week</option><option>This Month</option><option>This Quarter</option></select></div>'}
function tableRows(){var h='';for(var i=0;i<restaurants.length;i++){h+='<tr><td>'+restaurants[i]+'</td><td>'+money(19000+i*1700)+'</td><td>'+(21.4+i*.5).toFixed(1)+'%</td><td><span class="tag '+(i<4?'green':'orange')+'">'+(i<4?'On Track':'Review')+'</span></td></tr>'}return h}
function render(id){
if(id==='dashboard')return filters()+cards([['Net Sales',money(172340)],['Adjusted Sales',money(176920)],['Labour','22.7%'],['Food Cost','30.9%']])+'<div class="panel"><h3>Restaurant Performance</h3><table><tr><th>Restaurant</th><th>Sales</th><th>Labour</th><th>Status</th></tr>'+tableRows()+'</table></div>';
if(id==='restaurant')return filters()+cards([['Weekly Sales',money(25460)],['Covers','1,184'],['Labour','22.9%'],['Readiness','91%']])+'<div class="panel"><h3>Main Street Snapshot</h3><div class="body"><p class="note">Ranking #2 of 7 · Food Cost 30.2% · Delivery 21.8% · 2 open corrective actions.</p></div></div>';
if(id==='sales')return '<div class="panel"><h3>Daily Sales Entry</h3><div class="body"><div class="form"><label>Net Sale<input id="net" type="number" value="4200"></label><label>Discount<input id="disc" type="number" value="80"></label><label>Tax 1<input id="tax1" type="number" value="530"></label><label>Tax 2<input id="tax2" type="number" value="0"></label><label>Debit/Credit<input id="debit" type="number" value="3600"></label><label>Paid Out<input id="paid" type="number" value="40"></label><label>Cash On Hand<input id="cash" type="number" value="1090"></label><label>Paid Out Receipt<input type="file"></label></div><div id="calc" class="ok" style="margin-top:12px"></div><p><button class="btn primary" onclick="alert(\'Staging draft saved in this browser.\')">Save Draft</button></p></div></div>';
if(id==='employees')return '<div class="panel"><h3>Employee Management</h3><div class="body"><button class="btn primary" onclick="addEmployee()">+ Add Employee</button></div><table id="emp"><tr><th>ID</th><th>Name</th><th>Position</th><th>Restaurant</th><th>Status</th></tr><tr><td>1001</td><td>John Michael</td><td>Manager</td><td>Main Street</td><td><span class="tag green">Active</span></td></tr><tr><td>1002</td><td>Laura Gomez</td><td>Supervisor</td><td>Main Street</td><td><span class="tag green">Active</span></td></tr></table></div>';
if(id==='time')return cards([['Week Hours','684.5'],['Stat Hours','48.0'],['No-Shows','2'],['Payroll Status','Open']])+'<div class="panel"><h3>Time Entries</h3><table><tr><th>Employee</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Total</th><th>Status</th></tr><tr><td>John Michael</td><td>8.0</td><td>8.0</td><td>8.0</td><td>40.0</td><td><span class="tag green">Complete</span></td></tr><tr><td>Laura Gomez</td><td>7.5</td><td>7.5</td><td>7.5</td><td>37.5</td><td><span class="tag orange">Review</span></td></tr></table></div>';
if(id==='schedule')return '<div class="panel"><h3>Weekly Employee Schedule</h3><div class="body"><button class="btn">Copy Last Week</button> <button class="btn primary">Publish Schedule</button><p class="note">Minimum staffing: 1 Manager + 1 Cashier + 1 Cook.</p></div><table><tr><th>Employee</th><th>Mon</th><th>Tue</th><th>Wed</th><th>Thu</th><th>Fri</th></tr><tr><td>John Michael · Manager</td><td>10–18</td><td>10–18</td><td>10–18</td><td>10–18</td><td>10–18</td></tr><tr><td>Laura Gomez · Supervisor</td><td>12–20</td><td>12–20</td><td>OFF</td><td>12–20</td><td>12–20</td></tr></table></div>';
if(id==='payroll')return cards([['Pay Period','Sep 28 – Oct 11'],['Employees','41'],['Total Hours','1,376.5'],['Status','Draft']])+'<div class="panel"><h3>Payroll Review</h3><table><tr><th>ID</th><th>Employee</th><th>Week 1</th><th>Week 2</th><th>Stat</th><th>Total</th></tr><tr><td>1001</td><td>John Michael</td><td>40.0</td><td>40.0</td><td>0</td><td>80.0</td></tr><tr><td>1002</td><td>Laura Gomez</td><td>37.5</td><td>39.0</td><td>0</td><td>76.5</td></tr></table><div class="body"><button class="btn primary">Submit Payroll</button></div></div>';
if(id==='food')return '<div class="panel"><h3>Invoice Entry</h3><div class="body"><div class="form"><label>Vendor<input value="Sysco"></label><label>Invoice #<input value="INV-10482"></label><label>Before HST<input value="4120"></label><label>HST<input value="535.60"></label><label>Total<input value="4655.60" disabled></label></div><p><button class="btn primary">Submit Invoice</button></p><div class="ok">Food Cost uses Before HST only.</div></div></div>';
if(id==='reports')return filters()+cards([['Weekly Sales',money(172340)],['Labour','22.7%'],['Food Cost','30.9%'],['Delivery','20.8%']])+'<div class="panel"><h3>Report Centre</h3><div class="body"><button class="btn">Excel</button> <button class="btn">PDF</button> <button class="btn">Print</button> <button class="btn">Email</button> <button class="btn">WhatsApp</button><p class="note">Daily, Weekly, Monthly, Quarterly, Yearly, Comparison, Labour, Food Cost and Operating Cost reports.</p></div></div>';
if(id==='evaluation')return cards([['Internal Audit','94.3%'],['Next-Round Readiness','91%'],['Open Actions','3'],['Repeat Findings','1']])+'<div class="panel"><h3>Evaluation & Compliance</h3><div class="body"><div class="filters"><button class="btn primary" onclick="ev(0)">Checklist</button><button class="btn" onclick="ev(1)">Corrective Actions</button><button class="btn" onclick="ev(2)">Training</button><button class="btn" onclick="ev(3)">Challenge Review</button><button class="btn" onclick="ev(4)">Readiness</button><button class="btn" onclick="ev(5)">Round Comparison</button></div><div id="evbody"></div></div></div>';
if(id==='tasks')return '<div class="panel"><h3>Management Tasks</h3><div class="body"><button class="btn primary">+ Add Task</button></div><table><tr><th>Task</th><th>Restaurant</th><th>Assigned To</th><th>Status</th></tr><tr><td>Replace damaged holding bar label</td><td>Main Street</td><td>Manager</td><td><span class="tag orange">In Progress</span></td></tr><tr><td>Verify sanitizer station</td><td>Meadowvale</td><td>Supervisor</td><td><span class="tag red">Open</span></td></tr></table></div>';
return '<div class="panel"><h3>Users, Roles & Locations</h3><div class="body"><p class="note">Admin · Director · RGM · Manager · Supervisor</p><p class="note">Main Street · Meadowvale · Financial · 400 Queen · 1402 Queen · Royal West · Midland</p></div></div><div class="warn">Staging uses sample data. Do not enter real SIN/SSN, banking, payroll or other confidential employee data.</div>';
}
function show(id,name,button){var all=document.querySelectorAll('.nav button');for(var i=0;i<all.length;i++)all[i].classList.remove('active');button.classList.add('active');document.getElementById('title').textContent=name;content.innerHTML=render(id);if(id==='sales')wireSales();if(id==='evaluation')ev(0)}
function wireSales(){var ids=['net','disc','tax1','tax2','debit','paid','cash'];function c(){var v={};for(var i=0;i<ids.length;i++)v[ids[i]]=Number(document.getElementById(ids[i]).value||0);var expected=v.net+v.tax1+v.tax2-v.debit-v.paid;document.getElementById('calc').innerHTML='Adjusted Net Sales: <b>'+money(v.net+v.disc)+'</b> · Expected Cash: <b>'+money(expected)+'</b> · Over/Short: <b>'+money(v.cash-expected)+'</b>'}for(var i=0;i<ids.length;i++)document.getElementById(ids[i]).oninput=c;c()}
function addEmployee(){var n=prompt('Employee name');if(!n)return;var t=document.getElementById('emp');var r=t.insertRow();r.innerHTML='<td>1003</td><td>'+n+'</td><td>Cashier</td><td>Main Street</td><td><span class="tag green">Active</span></td>'}
function ev(n){var a=[
'<table><tr><th>Requirement</th><th>Status</th><th>Points</th><th>Responsibility</th></tr><tr><td>FS25 Chemicals labeled/stored properly</td><td><span class="tag orange">Needs Attention</span></td><td>4</td><td>Manager</td></tr><tr><td>FS34 Sanitizer containers / open food</td><td><span class="tag red">Non-Compliant</span></td><td>2</td><td>Supervisor</td></tr><tr><td>FS45 HACCP logs complete 14 days</td><td><span class="tag orange">Needs Attention</span></td><td>8</td><td>Manager</td></tr></table>',
'<table><tr><th>Finding</th><th>Corrective Action</th><th>Status</th></tr><tr><td>FS25</td><td>Relabel and reposition chemicals</td><td><span class="tag blue">In Progress</span></td></tr><tr><td>FS34</td><td>Move sanitizer away from open food</td><td><span class="tag blue">Manager Completed</span></td></tr><tr><td>FS45</td><td>Complete missing HACCP logs</td><td><span class="tag orange">Needs Attention</span></td></tr></table>',
'<table><tr><th>Requirement</th><th>Training</th><th>Status</th></tr><tr><td>FS25</td><td>Chemical safety and storage</td><td><span class="tag blue">In Progress</span></td></tr><tr><td>FS45</td><td>HACCP log completion</td><td><span class="tag orange">Assigned</span></td></tr></table>',
'<div class="warn">NPOP flags possible challenges only. Operations makes the final decision.</div><p class="note">FS25 · Needs Review · Evidence Attached<br>FS34 · Needs Review · Evidence Missing<br>FS45 · Appears Valid</p>',
'<div class="ok"><b>91% Next-Round Readiness</b><br>100% requires all corrective actions, training and Operations verification completed.</div>',
'<table><tr><th>Requirement</th><th>Previous</th><th>Current</th><th>Comparison</th></tr><tr><td>FS25</td><td>Missed</td><td>Needs Attention</td><td><span class="tag red">Repeat Risk</span></td></tr><tr><td>FS34</td><td>—</td><td>Non-Compliant</td><td><span class="tag orange">New Finding</span></td></tr><tr><td>FS45</td><td>Missed</td><td>Verified</td><td><span class="tag green">Improved</span></td></tr></table>'];document.getElementById('evbody').innerHTML=a[n]}
for(var i=0;i<modules.length;i++){(function(m,ix){var b=document.createElement('button');b.textContent=m[1];b.className=ix===0?'active':'';b.onclick=function(){show(m[0],m[1],b)};nav.appendChild(b)})(modules[i],i)}
show('dashboard','Executive Command Centre',nav.querySelector('button'));
</script></body></html>
